        combo: >-2
          ${{ (github.event_name == 'schedule' || github.event_name ==
          'workflow_dispatch') && fromJSON('[{"source_metadata":"on",
          "docstring_retention":"full"},{"source_metadata":"on",
          "docstring_retention":"simple"},{"source_metadata":"on",
          "docstring_retention":"none"},{"source_metadata":"off",
          "docstring_retention":"full"},{"source_metadata":"off",
          "docstring_retention":"simple"},{"source_metadata":"off",
          "docstring_retention":"none"}]') ||
          fromJSON('[{"source_metadata":"on","docstring_retention":"full"},
          {"source_metadata":"off","docstring_retention":"none"}]') }}
        shard:
          - shard: emacs-core
            label: core language/runtime
            make_target: test-emacs-core
            summary_name: Emacs core language/runtime
            selector: >-2
              (or "consent-base.*" "consent-eval.*"
              "consent-interpreter-module.*" "consent-macro.*"
              "consent-reader.*" "consent-result.*" "consent-runtime.*")
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Emacs
        uses: ./.github/actions/apt-install
        with:
          packages: emacs-nox

      - name: Run Emacs-hosted ERT shard
        shell: bash
        run: |
          mkdir -p ci-logs
          started=$SECONDS
          set +e
          make "${{ matrix.shard.make_target }}" 2>&1 | tee \
            "ci-logs/${CONSENT_CI_LOG_FILE}"
          status=${PIPESTATUS[0]}
          wall=$((SECONDS - started))
          {
            printf 'CONSENT_CI_SHARD_NAME=%s\n' \
              "${CONSENT_CI_SHARD_SUMMARY_NAME}"
            printf 'CONSENT_CI_SHARD_SELECTOR=%s\n' \
              '${{ matrix.shard.selector }}'
            printf 'CONSENT_CI_WALL_SECONDS=%s\n' "$wall"
          } >> "ci-logs/${CONSENT_CI_LOG_FILE}"
          exit "$status"

      - name: Upload Emacs-hosted shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: >-2
            test-log-${{ matrix.shard.shard }}-${{ matrix.combo.source_metadata
            }}-docstrings-${{ matrix.combo.docstring_retention }}
          path: ci-logs/${{ env.CONSENT_CI_LOG_FILE }}
          if-no-files-found: warn

      - name: Render Emacs-hosted shard timing summary
        if: always()
        run: |
          if [ -f "ci-logs/${CONSENT_CI_LOG_FILE}" ]; then
            emacs -Q --batch -L lisp \
              --load tools/consent-ci-write-summary.el
          fi

  test-parity:
    name: >-2
      Emacs/portable parity gate (syntax ${{ matrix.source_metadata }};
      docstrings ${{ matrix.docstring_retention }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required cross-implementation gate (#374): run the shared fixture corpus
    # through both in-repo cores -- the Emacs-hosted implementation and the
    # portable R7RS implementation, exercised here under Guile -- and fail on
    # any result divergence. The per-push lane runs the canonical on/full combo;
    # the scheduled / workflow_dispatch lane expands to the full 2x3 cross,
    # since each core's own shards already carry the metadata/docstring axis.
    # Guile remains the parity host on ubuntu-latest. The Gauche-specific
    # portable-host jobs select Ubuntu 26.04 explicitly for its apt package.
    env:
      CONSENT_PARITY_HOST: guile
      CONSENT_TEST_SOURCE_METADATA: ${{ matrix.source_metadata }}
      CONSENT_TEST_DOCSTRING_RETENTION: ${{ matrix.docstring_retention }}
      CONSENT_TEST_MAX_SOURCE_METADATA: >-2
        ${{ matrix.source_metadata == 'on' &&
        '250000' || '' }}
      CONSENT_CI_LOG_FILE: >-2
        parity-guile-${{ matrix.source_metadata }}-docstrings-${{
        matrix.docstring_retention }}.log
      CONSENT_CI_SHARD_SUMMARY_NAME: >-2
        Emacs/portable parity gate / source metadata ${{ matrix.source_metadata
        }} / docstrings ${{ matrix.docstring_retention }}
    strategy:
      fail-fast: false
      matrix:
        source_metadata: >-2
          ${{ (github.event_name == 'schedule' || github.event_name ==
          'workflow_dispatch') && fromJSON('["on", "off"]') ||
          fromJSON('["on"]') }}
        docstring_retention: >-2
          ${{ (github.event_name == 'schedule' || github.event_name ==
          'workflow_dispatch') && fromJSON('["full", "simple", "none"]') ||
          fromJSON('["full"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Emacs and Guile
        uses: ./.github/actions/apt-install
        with:
          packages: emacs-nox guile-3.0

      - name: Verify Guile
        run: |
          guile --no-auto-compile --r7rs -L scheme \
            -c \
              '(import (scheme base) (scheme write)) (write (+ 1 2)) (newline)'

      - name: Run Emacs/portable parity gate
        shell: bash
        run: |
          mkdir -p ci-logs
          started=$SECONDS
          set +e
          make test-parity 2>&1 | tee "ci-logs/${CONSENT_CI_LOG_FILE}"
          status=${PIPESTATUS[0]}
          wall=$((SECONDS - started))
          {
            printf 'CONSENT_CI_SHARD_NAME=%s\n' \
              "${CONSENT_CI_SHARD_SUMMARY_NAME}"
            printf 'CONSENT_CI_SHARD_SELECTOR=%s\n' '"^consent-parity-test-.*"'
            printf 'CONSENT_CI_WALL_SECONDS=%s\n' "$wall"
          } >> "ci-logs/${CONSENT_CI_LOG_FILE}"
          exit "$status"

      - name: Upload parity gate shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: >-2
            test-log-parity-guile-${{ matrix.source_metadata }}-docstrings-${{
            matrix.docstring_retention }}
          path: ci-logs/${{ env.CONSENT_CI_LOG_FILE }}
          if-no-files-found: warn

      - name: Render parity gate shard timing summary
        if: always()
        run: |
          if [ -f "ci-logs/${CONSENT_CI_LOG_FILE}" ]; then
            emacs -Q --batch -L lisp \
              --load tools/consent-ci-write-summary.el
          fi

  test-summary:
    name: test shard timing summary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - test-portable-gambit
      - test-portable-gambit-single-program
      - test-portable-gambit-self-host
      - test-portable-racket-self-host
      - test-portable-guile-shards
      - test-portable-gauche-shards
      - test-portable-extra-hosts
      - test-portable-gauche-hosts
      - test-emacs-hosted
      - test-emacs-core
      - test-parity
    if: always()

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Emacs
        uses: ./.github/actions/apt-install
        with:
          packages: emacs-nox

      - name: Download shard logs
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: test-log-*
          path: ci-logs
          merge-multiple: true

      - name: Render combined timing summary
        shell: bash
        run: |
          mkdir -p ci-logs
          logs=()
          while IFS= read -r -d '' log; do
            logs+=("$log")
          done < <(find ci-logs -type f -name '*.log' -print0)
          if [ "${#logs[@]}" -eq 0 ]; then
            printf '%s\n' 'No shard logs were available.' >> \
              "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          summary_file=ci-logs/test-shard-summary.md
          : > "$summary_file"
          CONSENT_CI_SUMMARY_FILE="$summary_file" emacs -Q --batch -L lisp \
            --eval "(require 'consent-ci)" \
            --funcall consent-ci-summary-batch-main -- "${logs[@]}"
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"

      # Structured, append-only per-run record for longitudinal analysis (#465).
      # Extends the consent-ci summary path over the same shard logs; the record
      # is JSON Lines tagged with schema_version. The durable sink is a
      # long-retention artifact for now; a queryable orphan-branch sink is
      # tracked as a follow-up. See docs/ci-run-record.md.
      - name: Emit per-run CI record
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONSENT_CI_PARITY_RESULT: ${{ needs.test-parity.result }}
          CONSENT_CI_RUN_URL: >-2
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
          CONSENT_CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CONSENT_CI_BASE_REF: >-2
            ${{ github.event.pull_request.base.ref || github.ref_name }}
          CONSENT_CI_HEAD_SHA: >-2
            ${{ github.event.pull_request.head.sha || github.sha }}
          CONSENT_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p ci-logs
          logs=()
          while IFS= read -r -d '' log; do
            logs+=("$log")
          done < <(find ci-logs -type f -name '*.log' -print0)
          if [ "${#logs[@]}" -eq 0 ]; then
            printf '%s\n' \
              'No shard logs were available; skipping per-run record.'
            exit 0
          fi
          CONSENT_CI_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export CONSENT_CI_TIMESTAMP
          # Change scope comes from the PR API (history-independent here, since
          # the summary job only checks out the merge commit). Null on push /
          # schedule lanes, which have no pull request to size.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n \
            "${CONSENT_CI_PR_NUMBER}" ]; then
            if scope="$(gh pr view "${CONSENT_CI_PR_NUMBER}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --json files,changedFiles,additions,deletions \
                    2>/dev/null)"; then
              CONSENT_CI_CHANGED_FILES=$(printf '%s' "$scope" |
                jq -r '.changedFiles')
              CONSENT_CI_INSERTIONS=$(printf '%s' "$scope" |
                jq -r '.additions')
              CONSENT_CI_DELETIONS=$(printf '%s' "$scope" |
                jq -r '.deletions')
              export CONSENT_CI_CHANGED_FILES CONSENT_CI_INSERTIONS \
                CONSENT_CI_DELETIONS
              version_file=scheme/consent/version.sld
              if printf '%s' "$scope" |
                  jq -e --arg path "$version_file" \
                    '.files[] | select(.path == $path)' >/dev/null; then
                export CONSENT_CI_VERSION_CHANGED=true
              else
                export CONSENT_CI_VERSION_CHANGED=false
              fi
            fi
          fi
          CONSENT_CI_RUN_RECORD_FILE=ci-logs/run-record.jsonl emacs -Q \
            --batch -L lisp \
            --eval "(require 'consent-ci)" \
            --funcall consent-ci-run-record-batch-main -- "${logs[@]}"
          printf 'Wrote per-run CI record:\n'
          cat ci-logs/run-record.jsonl

      - name: Upload per-run CI record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-run-record
          path: ci-logs/run-record.jsonl
          retention-days: 90
          if-no-files-found: ignore

      - name: Prepare pull request timing comment
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          CONSENT_CI_RUN_URL: >-2
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          mkdir -p ci-logs
          logs=()
          while IFS= read -r -d '' log; do
            logs+=("$log")
          done < <(find ci-logs -type f -name '*.log' -print0)
          if [ "${#logs[@]}" -eq 0 ]; then
            printf '%s\n\n%s\n' '<!-- consent-ci-timing-summary -->' \
              'No shard logs were available.' > ci-logs/pr-timing-summary.md
            exit 0
          fi
          CONSENT_CI_PR_SUMMARY_FILE=ci-logs/pr-timing-summary.md emacs -Q \
            --batch -L lisp \
            --eval "(require 'consent-ci)" \
            --funcall consent-ci-pr-summary-batch-main -- "${logs[@]}"

      - name: Publish pull request timing comment
        if: >-2
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONSENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- consent-ci-timing-summary -->'
          comment_file=ci-logs/pr-timing-summary.md
          comments_api="repos/${GITHUB_REPOSITORY}/issues"
          comments_api="${comments_api}/${CONSENT_PR_NUMBER}/comments"
          if [ ! -s "$comment_file" ]; then
            printf '%s\n\nNo shard timing summary was available.' "$marker" > \
              "$comment_file"
          fi
          comment_id="$(gh api "$comments_api" \
            --paginate \
            --jq \
              '.[] | select(.body | contains("timing-summary")) | .id' \
            | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --field "body=@${comment_file}" \
              --silent
          else
            gh api --method POST \
              "$comments_api" \
              --field "body=@${comment_file}" \
              --silent
          fi

  live-local-model:
    name: live local model smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CONSENT_LIVE_MODEL_ENDPOINT: http://127.0.0.1:11434/v1
      CONSENT_LIVE_MODEL_ID: qwen3:0.6b
      OLLAMA_VERSION: 0.24.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install runtime dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: ca-certificates curl emacs-nox make racket zstd

      - name: Cache Racket R7RS package
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/racket
            ~/.cache/racket
          key: ${{ runner.os }}-racket-r7rs-v1

      - name: Cache Racket compiled build tree
        uses: actions/cache@v4
        with:
          path: |
            build/compile/racket/src
            build/compile/racket/collections
          key: >-2
            ${{ runner.os }}-racket-build-v2-${{ hashFiles('scheme/**',
            'tools/compile-portable.sh') }}
          restore-keys: |
            ${{ runner.os }}-racket-build-v2-

      - name: Verify Racket host
        run: |
          raco pkg install --batch --auto --skip-installed --no-docs r7rs
          racket -I r7rs -e \
            '(import (scheme base) (scheme write)) (write (+ 1 2)) (newline)'

      - name: Cache Ollama models
        uses: actions/cache@v5
        with:
          path: ~/.ollama/models
          key: ${{ runner.os }}-ollama-qwen3-06b-v1

      - name: Install Ollama
        run: |
          ollama_root=https://ollama.com/download
          ollama_archive=ollama-linux-amd64.tar.zst
          curl -fsSL \
            "${ollama_root}/${ollama_archive}?version=${OLLAMA_VERSION}" \
            | zstd -d \
            | sudo tar -xf - -C /usr/local
          ollama --version

      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull smoke model
        run: ollama pull "$CONSENT_LIVE_MODEL_ID"

      - name: Run live local model smoke
        run: make test-live-model-ci

      - name: Show Ollama log on failure
        if: failure()
        run: cat /tmp/ollama.log
