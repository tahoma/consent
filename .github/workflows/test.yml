name: Test

on:
  pull_request:
  push:
    branches:
      - main
  # Exhaustive opt-in lane: run the full source-metadata × docstring-retention
  # cross-product on every host and Emacs shard nightly and on demand. The
  # per-push lane (pull_request / push) trims this matrix; see the per-job
  # `if:` guards below.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

# Cancel only superseded pull-request runs: a new push to a PR coalesces onto
# the PR-numbered group and cancels the in-flight run. Pushes to main,
# scheduled runs, and manual dispatches each get a unique run-id group, so they
# are never cancelled or coalesced.
concurrency:
  group: >-2
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' &&
    github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Compiled self-host build jobs publish the product interpreter before their
  # Scheme-native test matrices start. Those matrices exercise the same named
  # plan shards as direct hosts, making compiled/direct timings comparable while
  # keeping the compiled evaluator itself under test.

jobs:
  license-reuse:
    name: REUSE / SPDX license compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install REUSE
        run: pip install reuse

      - name: Check REUSE/SPDX compliance
        run: reuse lint

  lint-elisp:
    name: Emacs byte-compile lint (warnings-as-errors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Emacs
        uses: ./.github/actions/apt-install
        with:
          packages: emacs-nox

      - name: Byte-compile lisp/ with warnings-as-errors
        run: make lint-elisp

  lint-portable:
    name: Portable-host compiler lint (warnings-as-errors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Portable twin of lint-elisp (#421): compile the host-loadable portable
    # libraries under Guile with static warnings promoted to errors. Guile is
    # the gate host because it is the only in-CI portable host with a usable
    # `-W` warning facility; it ships in the bare ubuntu-latest apt universe.
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Guile
        uses: ./.github/actions/apt-install
        with:
          packages: guile-3.0

      - name: Verify Guile
        run: guile --version

      - name: Compile portable libraries with warnings-as-errors
        run: make lint-portable

  test-portable-gambit:
    name: >-2
      portable R7RS / Gambit full suite / syntax ${{
      matrix.combo.source_metadata }} / docstrings ${{
      matrix.combo.docstring_retention }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Gambit is the canonical portable host: on the per-push lane its suite runs
    # the canonical on/full combo plus a single fully-stripped off/none
    # de-feature smoke leg, while its reflection contract/stress shards run
    # on/full only
    # (#481). The scheduled / workflow_dispatch lane expands the suite back to
    # the full 2×3 syntax/docstring cross-product. The reader/writer/docstring
    # machinery that axis exercises is host-independent, so the other portable
    # hosts only run the canonical combo on the per-push lane (see
    # test-portable-extra-hosts).
    env:
      CONSENT_GAMBIT_VERSION: "4.9.7"
# readability-allow: contiguous-datum -- Compiler checksum stays atomic.
      CONSENT_GAMBIT_SHA256: "0da7c9772a2186dab1fba6bf6c777afe7424f40beacadf1b117d5cc825fe2db3"
      CONSENT_TEST_SOURCE_METADATA: ${{ matrix.combo.source_metadata }}
      CONSENT_TEST_DOCSTRING_RETENTION: ${{ matrix.combo.docstring_retention }}
      CONSENT_TEST_MAX_SOURCE_METADATA: >-2
        ${{ matrix.combo.source_metadata == 'on' && '250000' || '' }}
      CONSENT_CI_REFLECT_LOG_FILE: >-2
        portable-gambit-reflect-${{ matrix.combo.source_metadata
        }}-docstrings-${{ matrix.combo.docstring_retention }}.log
      CONSENT_CI_REFLECT_STRESS_LOG_FILE: >-2
        portable-gambit-reflect-stress-${{ matrix.combo.source_metadata
        }}-docstrings-${{ matrix.combo.docstring_retention }}.log
      CONSENT_CI_REFLECT_SHARD_SUMMARY_NAME: >-2
        Portable R7RS Gambit reflection contract / source metadata ${{
        matrix.combo.source_metadata }} / docstrings ${{
        matrix.combo.docstring_retention }}
      CONSENT_CI_REFLECT_STRESS_SHARD_SUMMARY_NAME: >-2
        Portable R7RS Gambit reflection stress / source metadata ${{
        matrix.combo.source_metadata }} / docstrings ${{
        matrix.combo.docstring_retention }}
    strategy:
      fail-fast: false
      # Per-push lane: canonical on/full plus a single fully-stripped off/none
      # smoke leg. Scheduled / workflow_dispatch lane: full 2×3 cross.
      matrix:
        combo: >-2
          ${{ (github.event_name == 'schedule' || github.event_name ==
          'workflow_dispatch') && fromJSON('[{"source_metadata":"on",
          "docstring_retention":"full"},{"source_metadata":"on",
          "docstring_retention":"simple"},{"source_metadata":"on",
          "docstring_retention":"none"},{"source_metadata":"off",
          "docstring_retention":"full"},{"source_metadata":"off",
          "docstring_retention":"simple"},{"source_metadata":"off",
          "docstring_retention":"none"}]') ||
          fromJSON('[{"source_metadata":"on","docstring_retention":"full"},
          {"source_metadata":"off","docstring_retention":"none"}]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Gambit
        id: cache-gambit
        uses: actions/cache@v4
        with:
# readability-allow: external-identifier -- Cache key expression stays whole.
          path: ${{ runner.tool_cache }}/gambit/${{ env.CONSENT_GAMBIT_VERSION }}
          key: ${{ runner.os }}-gambit-${{ env.CONSENT_GAMBIT_VERSION }}

      - name: Install Gambit build dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: emacs-nox build-essential ca-certificates curl libssl-dev

      - name: Install Gambit
        run: |
          gambit_prefix="${RUNNER_TOOL_CACHE}/gambit/${CONSENT_GAMBIT_VERSION}"
          if [ ! -x "${gambit_prefix}/bin/gsi" ]; then
            gambit_repo_root="https://github.com/gambit/gambit"
            gambit_archive_root="${gambit_repo_root}/archive/refs/tags"

            curl -fsSL \
              "${gambit_archive_root}/v${CONSENT_GAMBIT_VERSION}.tar.gz" \
              -o /tmp/gambit.tar.gz
            printf '%s  %s\n' "${CONSENT_GAMBIT_SHA256}" /tmp/gambit.tar.gz | \
              sha256sum -c -

            rm -rf /tmp/gambit-src
            mkdir -p /tmp/gambit-src "${gambit_prefix}"
            tar -xzf /tmp/gambit.tar.gz -C /tmp/gambit-src --strip-components=1
            cd /tmp/gambit-src
            ./configure --prefix="${gambit_prefix}" --enable-single-host \
              --enable-openssl
            make -j"$(nproc)"
            make install
          fi

          echo "${gambit_prefix}/bin" >> "$GITHUB_PATH"
          "${gambit_prefix}/bin/gsi" -v
          "${gambit_prefix}/bin/gsc" -v
          "${gambit_prefix}/bin/gsi" -:r7rs -e \
            '(import (scheme base) (scheme write)) (write (+ 1 2)) (newline)'

      - name: Verify owned reader avoids host identity maps
        if: >-2
          ${{ matrix.combo.source_metadata == 'on' &&
          matrix.combo.docstring_retention == 'full' }}
        env:
          CONSENT_PORTABLE_HOST: gambit
        run: make test-portable-owned-reader-no-host-identity

      - name: Verify exhaustive Unicode semantics
        if: >-2
          ${{ (github.event_name == 'schedule' || github.event_name ==
          'workflow_dispatch') && matrix.combo.source_metadata == 'on' &&
          matrix.combo.docstring_retention == 'full' }}
        env:
          CONSENT_UNICODE_SEMANTIC_HOST: gambit
        run: make check-unicode-semantics

      - name: Run portable R7RS Gambit shard
        shell: bash
        env:
          CONSENT_CI_LOG_DIR: ci-logs
          CONSENT_CI_LOG_PREFIX: portable-gambit-direct
          CONSENT_CI_LOG_SUFFIX: >-2
            ${{ matrix.combo.source_metadata }}-docstrings-${{
            matrix.combo.docstring_retention }}
          CONSENT_CI_SHARD_PREFIX: Portable R7RS Gambit
          CONSENT_CI_SHARD_SUFFIX: >-2
             / source metadata ${{ matrix.combo.source_metadata }} / docstrings
            ${{ matrix.combo.docstring_retention }}
        run: |
          mkdir -p ci-logs
          make test-portable-gambit

      - name: Run portable R7RS Gambit reflection stress shard
        if: >-2
          ${{ matrix.combo.source_metadata == 'on' &&
          matrix.combo.docstring_retention == 'full' }}
        shell: bash
        run: |
          mkdir -p ci-logs
          started=$SECONDS
          set +e
          make test-portable-gambit-reflect-stress 2>&1 | tee \
            "ci-logs/${CONSENT_CI_REFLECT_STRESS_LOG_FILE}"
          status=${PIPESTATUS[0]}
          wall=$((SECONDS - started))
          {
            printf 'CONSENT_CI_SHARD_NAME=%s\n' \
              "${CONSENT_CI_REFLECT_STRESS_SHARD_SUMMARY_NAME}"
            printf 'CONSENT_CI_SHARD_SELECTOR=%s\n' \
              '"^consent-scheme-gambit-host-test-r7rs-reflect-stress$"'
            printf 'CONSENT_CI_WALL_SECONDS=%s\n' "$wall"
          } >> "ci-logs/${CONSENT_CI_REFLECT_STRESS_LOG_FILE}"
          exit "$status"

      - name: Run portable R7RS Gambit reflection contract shard
        if: >-2
          ${{ matrix.combo.source_metadata == 'on' &&
          matrix.combo.docstring_retention == 'full' }}
        shell: bash
        run: |
          mkdir -p ci-logs
          started=$SECONDS
          set +e
          make test-portable-gambit-reflect 2>&1 | tee \
            "ci-logs/${CONSENT_CI_REFLECT_LOG_FILE}"
          status=${PIPESTATUS[0]}
          wall=$((SECONDS - started))
          {
            printf 'CONSENT_CI_SHARD_NAME=%s\n' \
              "${CONSENT_CI_REFLECT_SHARD_SUMMARY_NAME}"
            printf 'CONSENT_CI_SHARD_SELECTOR=%s\n' \
              '"^consent-scheme-gambit-host-test-r7rs-reflect$"'
            printf 'CONSENT_CI_WALL_SECONDS=%s\n' "$wall"
          } >> "ci-logs/${CONSENT_CI_REFLECT_LOG_FILE}"
          exit "$status"

      - name: Upload portable Gambit shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: >-2
            test-log-portable-gambit-${{ matrix.combo.source_metadata
            }}-docstrings-${{ matrix.combo.docstring_retention }}
          path: >-2
            ci-logs/portable-gambit-direct-*-${{ matrix.combo.source_metadata
            }}-docstrings-${{ matrix.combo.docstring_retention }}.log
          if-no-files-found: warn

      - name: Upload portable Gambit reflection contract shard log
        if: >-2
          ${{ always() && matrix.combo.source_metadata == 'on' &&
          matrix.combo.docstring_retention == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          name: >-2
            test-log-portable-gambit-reflect-${{ matrix.combo.source_metadata
            }}-docstrings-${{ matrix.combo.docstring_retention }}
          path: ci-logs/${{ env.CONSENT_CI_REFLECT_LOG_FILE }}
          if-no-files-found: warn

      - name: Upload portable Gambit reflection stress shard log
        if: >-2
          ${{ always() && matrix.combo.source_metadata == 'on' &&
          matrix.combo.docstring_retention == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          name: >-2
            test-log-portable-gambit-reflect-stress-${{
            matrix.combo.source_metadata }}-docstrings-${{
            matrix.combo.docstring_retention }}
          path: ci-logs/${{ env.CONSENT_CI_REFLECT_STRESS_LOG_FILE }}
          if-no-files-found: warn

      - name: Render portable Gambit shard timing summary
        if: always()
        shell: bash
        run: |
          logs=(ci-logs/*.log)
          if [ "${#logs[@]}" -gt 0 ]; then
            emacs -Q --batch -L lisp \
              --eval "(require 'consent-ci)" \
              --funcall consent-ci-summary-batch-main -- "${logs[@]}"
          fi

  test-portable-gambit-single-program:
    name: portable R7RS / Gambit single-program / ${{ matrix.case.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONSENT_GAMBIT_VERSION: "4.9.7"
# readability-allow: contiguous-datum -- Compiler checksum stays atomic.
      CONSENT_GAMBIT_SHA256: "0da7c9772a2186dab1fba6bf6c777afe7424f40beacadf1b117d5cc825fe2db3"
      CONSENT_TEST_SOURCE_METADATA: "on"
      CONSENT_TEST_DOCSTRING_RETENTION: full
      CONSENT_TEST_MAX_SOURCE_METADATA: "250000"
      CONSENT_PORTABLE_HOST: gambit
      CONSENT_PORTABLE_PROGRAM: ${{ matrix.case.program }}
      CONSENT_CI_LOG_FILE: portable-gambit-single-${{ matrix.case.slug }}.log
      CONSENT_CI_SHARD_SUMMARY_NAME: >-2
        Portable R7RS Gambit single-program ${{ matrix.case.label }} / source
        metadata on / docstrings full
    strategy:
      fail-fast: false
      matrix:
        case:
          - label: REPL integration
            slug: integration
            program: tests/scheme/consent-repl-test.scm
          - label: evaluator
            slug: evaluator
            program: tests/scheme/consent-eval-test.scm
          - label: random bits
            slug: random
            program: tests/scheme/stdlib-random-bits-test.scm
          - label: property testing
            slug: property
            program: tests/scheme/stdlib-property-testing-test.scm
          - label: AVL tree
            slug: library
            program: tests/scheme/data-avl-tree-test.scm
          - label: agent transcript
            slug: agent
            program: tests/scheme/consent-transcript-test.scm
          - label: symbol runtime
            slug: runtime
            program: tests/scheme/consent-symbol-test.scm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Gambit
        id: cache-gambit
        uses: actions/cache@v4
        with:
# readability-allow: external-identifier -- Cache key expression stays whole.
          path: ${{ runner.tool_cache }}/gambit/${{ env.CONSENT_GAMBIT_VERSION }}
          key: ${{ runner.os }}-gambit-${{ env.CONSENT_GAMBIT_VERSION }}

      - name: Install Gambit build dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: emacs-nox build-essential ca-certificates curl libssl-dev

      - name: Install Gambit
        run: |
          gambit_prefix="${RUNNER_TOOL_CACHE}/gambit/${CONSENT_GAMBIT_VERSION}"
          if [ ! -x "${gambit_prefix}/bin/gsi" ]; then
            gambit_repo_root="https://github.com/gambit/gambit"
            gambit_archive_root="${gambit_repo_root}/archive/refs/tags"

            curl -fsSL \
              "${gambit_archive_root}/v${CONSENT_GAMBIT_VERSION}.tar.gz" \
              -o /tmp/gambit.tar.gz
            printf '%s  %s\n' "${CONSENT_GAMBIT_SHA256}" /tmp/gambit.tar.gz | \
              sha256sum -c -

            rm -rf /tmp/gambit-src
            mkdir -p /tmp/gambit-src "${gambit_prefix}"
            tar -xzf /tmp/gambit.tar.gz -C /tmp/gambit-src --strip-components=1
            cd /tmp/gambit-src
            ./configure --prefix="${gambit_prefix}" --enable-single-host \
              --enable-openssl
            make -j"$(nproc)"
            make install
          fi

          echo "${gambit_prefix}/bin" >> "$GITHUB_PATH"
          "${gambit_prefix}/bin/gsi" -v
          "${gambit_prefix}/bin/gsc" -v
          "${gambit_prefix}/bin/gsi" -:r7rs -e \
            '(import (scheme base) (scheme write)) (write (+ 1 2)) (newline)'

      - name: Run one interpreted Gambit test program
        shell: bash
        run: |
          mkdir -p ci-logs
          started=$SECONDS
          set +e
          tools/run-portable-tests.sh 2>&1 | tee \
            "ci-logs/${CONSENT_CI_LOG_FILE}"
          status=${PIPESTATUS[0]}
          wall=$((SECONDS - started))
          {
            printf 'CONSENT_CI_SHARD_NAME=%s\n' \
              "${CONSENT_CI_SHARD_SUMMARY_NAME}"
            printf 'CONSENT_CI_SHARD_SELECTOR=%s\n' \
              "${CONSENT_PORTABLE_PROGRAM}"
            printf 'CONSENT_CI_WALL_SECONDS=%s\n' "$wall"
          } >> "ci-logs/${CONSENT_CI_LOG_FILE}"
          exit "$status"

      - name: Upload interpreted Gambit single-program log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-portable-gambit-single-${{ matrix.case.slug }}
          path: ci-logs/${{ env.CONSENT_CI_LOG_FILE }}
          if-no-files-found: warn

      - name: Render interpreted Gambit single-program timing summary
        if: always()
        shell: bash
        run: |
          if [ -f "ci-logs/${CONSENT_CI_LOG_FILE}" ]; then
            emacs -Q --batch -L lisp \
              --load tools/consent-ci-write-summary.el
          fi

  build-gambit-self-host:
    name: >-2
      build / Gambit-compiled self-host / syntax ${{
      matrix.combo.source_metadata }} / docstrings ${{
      matrix.combo.docstring_retention }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CONSENT_GAMBIT_VERSION: "4.9.7"
# readability-allow: contiguous-datum -- Compiler checksum stays atomic.
      CONSENT_GAMBIT_SHA256: "0da7c9772a2186dab1fba6bf6c777afe7424f40beacadf1b117d5cc825fe2db3"
      CONSENT_TEST_SOURCE_METADATA: ${{ matrix.combo.source_metadata }}
      CONSENT_TEST_DOCSTRING_RETENTION: ${{ matrix.combo.docstring_retention }}
      CONSENT_TEST_MAX_SOURCE_METADATA: >-2
        ${{ matrix.combo.source_metadata == 'on' && '250000' || '' }}
    strategy:
      fail-fast: false
      matrix:
        combo: >-2
          ${{ (github.event_name == 'schedule' || github.event_name ==
          'workflow_dispatch') && fromJSON('[{"source_metadata":"on",
          "docstring_retention":"full"},{"source_metadata":"on",
          "docstring_retention":"simple"},{"source_metadata":"on",
          "docstring_retention":"none"},{"source_metadata":"off",
          "docstring_retention":"full"},{"source_metadata":"off",
          "docstring_retention":"simple"},{"source_metadata":"off",
          "docstring_retention":"none"}]') ||
          fromJSON('[{"source_metadata":"on","docstring_retention":"full"}]')
          }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Gambit
        id: cache-gambit
        uses: actions/cache@v4
        with:
# readability-allow: external-identifier -- Cache key expression stays whole.
          path: ${{ runner.tool_cache }}/gambit/${{ env.CONSENT_GAMBIT_VERSION }}
          key: ${{ runner.os }}-gambit-${{ env.CONSENT_GAMBIT_VERSION }}

      - name: Install Gambit build dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential ca-certificates curl libssl-dev make

      - name: Install Gambit
        run: |
          gambit_prefix="${RUNNER_TOOL_CACHE}/gambit/${CONSENT_GAMBIT_VERSION}"
          if [ ! -x "${gambit_prefix}/bin/gsi" ]; then
            gambit_repo_root="https://github.com/gambit/gambit"
            gambit_archive_root="${gambit_repo_root}/archive/refs/tags"

            curl -fsSL \
              "${gambit_archive_root}/v${CONSENT_GAMBIT_VERSION}.tar.gz" \
              -o /tmp/gambit.tar.gz
            printf '%s  %s\n' "${CONSENT_GAMBIT_SHA256}" /tmp/gambit.tar.gz | \
              sha256sum -c -
            rm -rf /tmp/gambit-src
            mkdir -p /tmp/gambit-src "${gambit_prefix}"
            tar -xzf /tmp/gambit.tar.gz -C /tmp/gambit-src --strip-components=1
            cd /tmp/gambit-src
            ./configure --prefix="${gambit_prefix}" --enable-single-host \
              --enable-openssl
            make -j"$(nproc)"
            make install
          fi
          echo "${gambit_prefix}/bin" >> "$GITHUB_PATH"

      - name: Cache Gambit compiled build tree
        uses: actions/cache@v4
        with:
          path: |
            build/compile/gambit/src
            build/compile/gambit/incremental
          key: >-2
            ${{ runner.os }}-gambit-build-v2-${{ env.CONSENT_GAMBIT_VERSION
            }}-${{ hashFiles('scheme/**', 'tools/compile-portable.sh') }}-${{
            matrix.combo.source_metadata }}-${{
            matrix.combo.docstring_retention }}
          restore-keys: |
            ${{ runner.os }}-gambit-build-v2-${{ env.CONSENT_GAMBIT_VERSION }}-

      - name: Compile Gambit self-host
        run: CONSENT_COMPILE_HOST=gambit make compile

      - name: Upload Gambit self-host
        uses: actions/upload-artifact@v7
        with:
          name: >-2
            gambit-self-host-${{ matrix.combo.source_metadata }}-docstrings-${{
            matrix.combo.docstring_retention }}
          path: build/compile/gambit/bin/consent
          if-no-files-found: error

  test-portable-gambit-self-host:
    name: >-2
      portable R7RS / Gambit-compiled self-host / ${{ matrix.case.label }} /
      syntax ${{ matrix.case.source_metadata }} / docstrings ${{
      matrix.case.docstring_retention }}
    needs: build-gambit-self-host
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONSENT_TEST_SOURCE_METADATA: ${{ matrix.case.source_metadata }}
      CONSENT_TEST_DOCSTRING_RETENTION: ${{ matrix.case.docstring_retention }}
      CONSENT_TEST_MAX_SOURCE_METADATA: >-2
        ${{ matrix.case.source_metadata == 'on' &&
        '250000' || '' }}
      CONSENT_PORTABLE_HOST: gambit-native
      CONSENT_PORTABLE_GROUP: ${{ matrix.case.group }}
      CONSENT_GAMBIT_NATIVE: >-2
        ${{ github.workspace }}/build/compile/gambit/bin/consent
      CONSENT_CI_LOG_FILE: >-2
        portable-gambit-native-${{ matrix.case.group }}-${{
        matrix.case.source_metadata }}-docstrings-${{
        matrix.case.docstring_retention }}.log
      CONSENT_CI_SHARD_SUMMARY_NAME: >-2
        Portable R7RS Gambit-compiled self-host ${{ matrix.case.label }} /
        source metadata ${{ matrix.case.source_metadata }} / docstrings ${{
        matrix.case.docstring_retention }}
    strategy:
      fail-fast: false
      matrix:
        case: >-2
          ${{ (github.event_name == 'schedule' || github.event_name ==
          'workflow_dispatch') && fromJSON('[{"group":"compiled-random","label":
          "random-data libraries","source_metadata":"on","docstring_retention":
          "full","aggregate":false},{"group":"compiled-property","label":
          "property-testing libraries","source_metadata":"on",
          "docstring_retention":"full","aggregate":false},{"group":
          "compiled-library","label":"standard
          libraries","source_metadata":"on","docstring_retention":"full",
          "aggregate":false},{"group":"compiled-runtime","label":
          "runtime/testing infrastructure","source_metadata":"on",
          "docstring_retention":"full","aggregate":false},{"group":
          "compiled-agent","label":"agent libraries","source_metadata":"on",
          "docstring_retention":"full","aggregate":false},{"group":
          "compiled-integration","label":"integration/REPL","source_metadata":
          "on","docstring_retention":"full","aggregate":false},{"group":
          "compiled","label":"exhaustive shard
          set","source_metadata":"on","docstring_retention":"simple",
          "aggregate":true},{"group":"compiled","label":"exhaustive shard
          set","source_metadata":"on","docstring_retention":"none","aggregate":
          true},{"group":"compiled","label":"exhaustive shard
          set","source_metadata":"off","docstring_retention":"full","aggregate":
          true},{"group":"compiled","label":"exhaustive shard
          set","source_metadata":"off","docstring_retention":"simple",
