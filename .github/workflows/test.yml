  test-portable-extra-hosts:
    name: >-2
      portable R7RS / ${{ matrix.host.host_name }} / syntax ${{
      matrix.source_metadata }} / docstrings ${{ matrix.docstring_retention }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEBIAN_FRONTEND: noninteractive
      CONSENT_TEST_SOURCE_METADATA: ${{ matrix.source_metadata }}
      CONSENT_TEST_DOCSTRING_RETENTION: ${{ matrix.docstring_retention }}
      CONSENT_TEST_MAX_SOURCE_METADATA: >-2
        ${{ matrix.source_metadata == 'on' &&
        '250000' || '' }}
      CONSENT_CI_LOG_FILE: >-2
        portable-${{ matrix.host.host }}-${{ matrix.source_metadata
        }}-docstrings-${{ matrix.docstring_retention }}.log
      CONSENT_CI_SHARD_SUMMARY_NAME: >-2
        ${{ matrix.host.summary_name }} / source metadata ${{
        matrix.source_metadata }} / docstrings ${{ matrix.docstring_retention
        }}
    strategy:
      fail-fast: false
      # Per-push lane runs every extra host on the canonical on/full combo only;
      # the scheduled / workflow_dispatch lane expands to the full 2×3 cross.
      # Gambit (test-portable-gambit) carries the full portable cross on every
      # lane, so the host-independent metadata/docstring axis stays covered.
      matrix:
        source_metadata: >-2
          ${{ (github.event_name == 'schedule' || github.event_name ==
          'workflow_dispatch') && fromJSON('["on", "off"]') ||
          fromJSON('["on"]') }}
        docstring_retention: >-2
          ${{ (github.event_name == 'schedule' || github.event_name ==
          'workflow_dispatch') && fromJSON('["full", "simple", "none"]') ||
          fromJSON('["full"]') }}
        host:
          - host: chibi
            host_name: Chibi
            apt_package: chibi-scheme chibi-scheme-common
            make_target: test-portable-chibi
            group_set: direct
            log_prefix: portable-chibi
            shard_prefix: Portable R7RS Chibi
          - host: racket
            host_name: Racket
            apt_package: racket
            make_target: test-portable-racket
            group_set: direct
            log_prefix: portable-racket
            shard_prefix: Portable R7RS Racket
          - host: guile-reflect-stress
            host_name: Guile reflection stress
            apt_package: guile-3.0
            make_target: test-portable-guile-reflect-stress
            summary_name: Portable R7RS Guile reflection stress
            selector: '"^consent-scheme-guile-host-test-r7rs-reflect-stress$"'
            group_set: single
          - host: racket-reflect-stress
            host_name: Racket reflection stress
            apt_package: racket
            make_target: test-portable-racket-reflect-stress
            summary_name: Portable R7RS Racket reflection stress
            selector: '"^consent-scheme-racket-host-test-r7rs-reflect-stress$"'
            group_set: single
          - host: guile-reflect
            host_name: Guile reflection contract
            apt_package: guile-3.0
            make_target: test-portable-guile-reflect
            summary_name: Portable R7RS Guile reflection contract
            selector: '"^consent-scheme-guile-host-test-r7rs-reflect$"'
            group_set: single
          - host: racket-reflect
            host_name: Racket reflection contract
            apt_package: racket
            make_target: test-portable-racket-reflect
            summary_name: Portable R7RS Racket reflection contract
            selector: '"^consent-scheme-racket-host-test-r7rs-reflect$"'
            group_set: single

    steps:
      - name: Install checkout tools
        shell: bash
        run: |
          sudo=""
          if [ "$(id -u)" -ne 0 ]; then sudo="sudo"; fi
          run() { $sudo timeout 180 "$@"; }
          ok=0
          for attempt in 1 2 3 4; do
            if run apt-get update -o Acquire::Retries=3 \
               && run apt-get install -y --no-install-recommends -o \
                 Acquire::Retries=3 ca-certificates git tar zstd; then
              ok=1
              break
            fi
            echo "::warning::apt attempt ${attempt} failed; retrying" >&2
            sleep $((attempt * 10))
          done
          [ "${ok}" -eq 1 ] || { echo "::error::apt failed after retries" \
            >&2; exit 1; }

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Racket R7RS package
        if: >-2
          matrix.host.host == 'racket' || matrix.host.host == 'racket-reflect'
          || matrix.host.host == 'racket-reflect-stress'
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/racket
            ~/.cache/racket
          key: ${{ runner.os }}-racket-r7rs-v1

      - name: Install portable R7RS host
        uses: ./.github/actions/apt-install
        with:
          packages: make emacs-nox ${{ matrix.host.apt_package }}

      - name: Verify portable R7RS host
        shell: bash
        run: |
          scheme_smoke='(import (scheme base) (scheme write))'
          scheme_smoke="${scheme_smoke} (write (+ 1 2)) (newline)"
          case "${{ matrix.host.host }}" in
            chibi)
              chibi-scheme -m scheme.base -m scheme.write \
                -e '(begin (write (+ 1 2)) (newline))'
              ;;
            racket|racket-reflect|racket-reflect-stress)
              raco pkg install --batch --auto --skip-installed --no-docs r7rs
              racket -I r7rs -e "$scheme_smoke"
              ;;
            guile|guile-reflect|guile-reflect-stress)
              guile --no-auto-compile --r7rs -c "$scheme_smoke"
              ;;
          esac

      - name: Verify owned reader avoids host identity maps
        if: >-2
          ${{ matrix.host.host == 'racket' &&
          matrix.source_metadata == 'on' &&
          matrix.docstring_retention == 'full' }}
        env:
          CONSENT_PORTABLE_HOST: racket
        run: make test-portable-owned-reader-no-host-identity

      - name: Run balanced portable R7RS host shard set
